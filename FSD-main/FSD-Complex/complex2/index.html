<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: lightblue;
        }

        .box {
            background: white;
            margin: 50px auto;
            padding: 20px;
            width: 300px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Weather App</h2>

        <input type="text" id="city" placeholder="Enter city">

        <button id="searchBtn">Search</button>

        <p id="status"></p>
        <h3 id="location"></h3>
        <p id="temp"></p>
        <p id="desc"></p>
        <p id="humidity"></p>
        <p id="wind"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
