
<!DOCTYPE html>
<html>
<head>
    <title>Register Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">My Website</a>
        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="register.html">Register</a>
            <a class="nav-link" href="login.html">Login</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center">Register</h2>

            <form>
                <label class="form-label">Name</label>
                <input type="text" class="form-control mb-3" placeholder="Enter name" required>

                <label class="form-label">Email</label>
                <input type="email" class="form-control mb-3" placeholder="Enter email" required>

                <label class="form-label">Password</label>
                <input type="password" class="form-control mb-3" placeholder="Enter password" required>

                <button class="btn btn-primary w-100">Register</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
